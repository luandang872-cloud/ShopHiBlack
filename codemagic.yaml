workflows:
  ios-hiblack:
    name: Hí Black iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.hiblack.shop

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Prepare web files for Capacitor
        script: |
          mkdir -p www
          cp index.html www/index.html
          [ -f style.css ] && cp style.css www/style.css || true
          [ -f app.js ] && cp app.js www/app.js || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/manifest.webmanifest || true
          [ -f sw.js ] && cp sw.js www/sw.js || true

      - name: Create iOS project
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa             --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace"             --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
