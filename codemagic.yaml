workflows:
  ios-hiblack:
    name: Hí Black iOS Unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Prepare web files for Capacitor
        script: |
          mkdir -p www
          cp index.html www/index.html
          [ -f style.css ] && cp style.css www/style.css || true
          [ -f app.js ] && cp app.js www/app.js || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/manifest.webmanifest || true
          [ -f sw.js ] && cp sw.js www/sw.js || true

      - name: Create iOS project
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Build unsigned iOS app
        script: |
          rm -rf "$CM_BUILD_DIR/build/ios"
          xcodebuild             -workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace"             -scheme "App"             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$CM_BUILD_DIR/build/ios"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             build

      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          rm -rf "$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ios/ipa/Payload/App.app"
          cd "$CM_BUILD_DIR/build/ios/ipa"
          zip -qry "Hí-Black-unsigned.ipa" Payload
          rm -rf Payload
      - name: Create downloadable ZIP
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/ios/ipa"
          zip -qry "Hi-Black-unsigned.zip" "Hí-Black-unsigned.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
        - build/ios/ipa/*.zip
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
